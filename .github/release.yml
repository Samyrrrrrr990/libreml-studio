changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: Security
      labels: ["security"]
    - title: Methodology and reproducibility
      labels: ["methodology", "reproducibility"]
    - title: Features
      labels: ["enhancement"]
    - title: Fixes
      labels: ["bug"]
    - title: Documentation
      labels: ["documentation"]
    - title: Other changes
      labels: ["*"]
